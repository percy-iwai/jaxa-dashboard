<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>宇宙関連予算ダッシュボード（FY2022-2026）</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080d1a;color:#d0dcff;font-family:'Segoe UI',Meiryo,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#0a1020 0%,#0d1b4a 50%,#0a1020 100%);
  padding:22px 36px;border-bottom:1px solid #1a3a7a;display:flex;align-items:center;gap:20px}
header h1{font-size:1.35rem;font-weight:600;letter-spacing:.04em;color:#e8f0ff}
header .sub{color:#6a96cc;font-size:.8rem;margin-top:5px}
.badge{background:#0d2060;border:1px solid #1a4a9a;border-radius:20px;
  padding:4px 14px;font-size:.72rem;color:#6ab0f0;margin-left:auto}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 36px 0}
.kpi{background:linear-gradient(135deg,#0d1b3e,#0d2060);border:1px solid #1a3a7a;
  border-radius:10px;padding:16px 20px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;
  background:#1565c0;border-radius:50%;opacity:.12}
.kpi-val{font-size:1.7rem;font-weight:700;color:#4da6ff;letter-spacing:-.02em}
.kpi-lbl{font-size:.7rem;color:#6a96cc;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 36px}
.card{background:#0b1428;border:1px solid #1a3a7a;border-radius:12px;padding:20px 22px}
.card h2{font-size:.78rem;color:#5a90cc;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #122050;
  display:flex;align-items:center;gap:8px}
.full{grid-column:1/-1}
canvas{max-height:260px!important}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{background:#0a1830;color:#5a90cc;padding:9px 12px;text-align:left;font-weight:500;
  position:sticky;top:0;z-index:1;border-bottom:2px solid #1a3a7a;white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid #0f2040}
tr:hover td{background:#0e1e3a}
.tbl-wrap{max-height:280px;overflow-y:auto;border-radius:6px;border:1px solid #122050}
.tbl-wrap::-webkit-scrollbar{width:6px}
.tbl-wrap::-webkit-scrollbar-track{background:#080d1a}
.tbl-wrap::-webkit-scrollbar-thumb{background:#1a4a8a;border-radius:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;
  padding:2px 8px;border-radius:10px;background:#0a1830;white-space:nowrap;
  border:1px solid #1a3a7a}
.filter-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input[type=text]{background:#0a1830;border:1px solid #1a3a7a;color:#d0dcff;
  padding:7px 12px;border-radius:7px;font-size:.78rem;width:200px;outline:none}
input[type=text]:focus{border-color:#3a7acc}
select{background:#0a1830;border:1px solid #1a3a7a;color:#d0dcff;
  padding:7px 10px;border-radius:7px;font-size:.78rem;outline:none}
.cnt{color:#5a90cc;font-size:.75rem}
.bar-wrap{position:relative;display:flex;align-items:center}
.bg-bar{position:absolute;left:0;top:0;bottom:0;border-radius:3px;opacity:.25}
.fg-val{position:relative;z-index:1;text-align:right;width:100%}
footer{text-align:center;color:#2a4060;font-size:.7rem;padding:24px;margin-top:4px}
</style>
</head>

  </div>

</header>

<div class="kpi-row" id="kpiRow"></div>

      </table>
    </div>
  </div>
  <div class="card full">

        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<footer>データ出典: 行政事業レビューポータルサイト（rssystem.go.jp）　※執行額は当該年度の実績（翌年度シートの前年度執行額）。FY2026は未確定　生成: 2026-10-29</footer>

TOP.forEach(r=>{
  const pct = r.b ? Math.round(r.b/maxB*80) : 0;
  const col = mCol(r.m);
  const nm = r.n.length>30 ? r.n.slice(0,29)+'…' : r.n;
  topTb.insertAdjacentHTML('beforeend',`
    <tr title="${r.n}">
      <td>${nm}</td>
      <td><span class="tag"><span class="dot" style="background:${col}"></span>${r.m}</span></td>
      <td style="color:#6a96cc">FY${r.y}</td>
      <td>
        <div class="bar-wrap">
          <div class="bg-bar" style="width:${pct}%;background:${col}"></div>
          <div class="fg-val">${r.b!=null?r.b.toLocaleString()+'億':'—'}</div>
        </div>
      </td>
      <td style="text-align:right;color:${r.r!=null?(r.r>=80?'#4fc3f7':r.r>=50?'#ffb74d':'#ef5350'):'#555'}">

// ======= All table =======
const ALL = ALL_RAW.sort((a,b)=>(b.b||0)-(a.b||0));
const allTb = document.querySelector('#allTbl tbody');
const srch = document.getElementById('srch');
const yrF  = document.getElementById('yrF');
const mnF  = document.getElementById('mnF');
const cntL = document.getElementById('cntLbl');

[...new Set(ALL.map(r=>r.y))].sort().forEach(y=>
  yrF.insertAdjacentHTML('beforeend',`<option>${y}</option>`));
[...new Set(ALL.map(r=>r.m))].sort().forEach(m=>
  mnF.insertAdjacentHTML('beforeend',`<option>${m}</option>`));

const maxAll = Math.max(...ALL.filter(r=>r.b).map(r=>r.b));
function renderAll(){
  const q = srch.value.toLowerCase();
  const y = yrF.value;
  const m = mnF.value;
  const fi = ALL.filter(r=>
    (!q||(r.n.toLowerCase().includes(q)||r.m.toLowerCase().includes(q)))&&
    (!y||String(r.y)===y)&&(!m||r.m===m));
  cntL.textContent = fi.length+'件';
  allTb.innerHTML='';
  fi.slice(0,250).forEach(r=>{
    const col = mCol(r.m);
    const pct = r.b?Math.round(r.b/maxAll*60):0;
    const rateCol = r.r!=null?(r.r>=80?'#4fc3f7':r.r>=50?'#ffb74d':'#ef5350'):'#3a5070';
    allTb.insertAdjacentHTML('beforeend',`
      <tr title="${r.n}">
        <td style="background:linear-gradient(90deg,${col}20 ${pct}%,transparent ${pct}%)">${r.n.length>38?r.n.slice(0,37)+'…':r.n}</td>
        <td><span class="tag"><span class="dot" style="background:${col}"></span>${r.m}</span></td>
        <td style="color:#6a96cc">FY${r.y}</td>
        <td style="text-align:right">${r.b!=null?r.b.toLocaleString():'—'}</td>
        <td style="text-align:right">${r.e!=null?r.e.toLocaleString():'—'}</td>
        <td style="text-align:right;color:${rateCol}">${r.r!=null?r.r+'%':'—'}</td>
      </tr>`);
  });
  if(fi.length>250) allTb.insertAdjacentHTML('beforeend',
    `<tr><td colspan="6" style="text-align:center;color:#3a6090;padding:10px">… 他 ${fi.length-250} 件（CSVをご参照ください）</td></tr>`);
}
renderAll();
[srch,yrF,mnF].forEach(el=>el.addEventListener('input',renderAll));
